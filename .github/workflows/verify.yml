name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout Hermes Agent at pinned tag
        # This plugin targets the SecretSource plugin API shipped in this tag.
        run: |
          git clone --depth 1 --branch v2026.7.1 \
            https://github.com/NousResearch/hermes-agent.git /opt/hermes-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hermes + deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e /opt/hermes-agent
          python -m pip install pytest

      - name: Register plugin into Hermes plugin dir
        run: |
          mkdir -p ~/.hermes/plugins/keeper-vault
          cp __init__.py plugin.yaml ~/.hermes/plugins/keeper-vault/

      - name: Run Hermes secret-source conformance + integration tests
        env:
          # Build the agent package path so `import agent.secret_sources.*` works.
          PYTHONPATH: /opt/hermes-agent
        run: |
          pytest tests/ -v
