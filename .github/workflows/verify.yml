name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    # Hermes is imported via PYTHONPATH rather than installed, but its own import chain
    # is NOT dependency-free: `agent.secret_sources._cache` pulls `utils` ->
    # `hermes_yaml` -> `ruamel.yaml`. Install the pinned commit's requirements the same
    # way a user would, then run the suite.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout Hermes Agent (pinned main — SecretSource API is post-v2026.7.1)
        # The pluggable SecretSource API this plugin targets landed on main after the
        # v2026.7.1 tag (2026-07-06, commit 2d16ec7fb7). Pin an exact commit so CI is
        # reproducible; bump this SHA when you update Hermes. The `hermes-main` job
        # below runs the same suite against unpinned main, so contract drift shows up
        # here instead of in a user's install.
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /opt/hermes-agent
          cd /opt/hermes-agent
          git fetch --depth 1 origin 5d5e763780661340aa69caaff019d9079db7d270
          git checkout 5d5e763780661340aa69caaff019d9079db7d270

      - name: Install test deps
        # pytest, the packages Hermes' own import chain needs on the test path, and
        # `build` for the packaging check below. Re-derive with:
        #   PYTHONPATH=/opt/hermes-agent python -m pytest tests/ -q
        # and install whatever ModuleNotFoundError names. The plugin-discovery tests
        # import hermes_cli.plugins -> utils, which needs `hermes_yaml` (ruamel.yaml) on
        # current main but plain `yaml` (PyYAML) on the pinned commit, and
        # hermes_cli.env_loader -> dotenv for the bootstrap assertion.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruamel.yaml PyYAML python-dotenv build

      - name: Check the distribution builds
        # A plugin directory that ships a pyproject.toml is a package-manager workspace
        # member that Hermes builds while admitting it, so a pyproject that cannot build
        # blocks `hermes plugins install <url> --enable` and leaves the plugin disabled
        # (it did, on this repo: an invalid `tool.setuptools.package-data` key).
        run: python -m build --sdist --wheel -o dist .

      - name: Run Hermes secret-source conformance + integration tests
        env:
          PYTHONPATH: /opt/hermes-agent
        run: |
          pytest tests/ -v

  hermes-main:
    # Advisory drift check: the same suite against unpinned Hermes main. Never blocks a
    # PR — a red run here means Hermes changed a contract this plugin relies on.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout Hermes Agent (unpinned main)
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /opt/hermes-agent

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruamel.yaml PyYAML python-dotenv

      - name: Run the suite against unpinned main
        env:
          PYTHONPATH: /opt/hermes-agent
        run: pytest tests/ -q
