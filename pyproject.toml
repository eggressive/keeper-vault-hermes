[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-secret-source-keeper"
version = "1.0.0"
description = "Keeper Secrets Manager (KSM) secret source plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "eggressive" }]
keywords = ["hermes-agent", "secret-source", "keeper", "ksm", "secrets-manager", "plugin"]
classifiers = [
    "Framework :: Hermes Agent",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # No hard dependency on Hermes itself; the host provides agent.secret_sources.*.
    # Requires Hermes main (post-v2026.7.1) — ships the SecretSource plugin API.
]

[project.urls]
Homepage = "https://github.com/eggressive/keeper-vault-hermes"
Source = "https://github.com/eggressive/keeper-vault-hermes"
"Hermes Agent" = "https://github.com/NousResearch/hermes-agent"

# No [tool.setuptools] section on purpose.
#
# This is a *directory* plugin: Hermes loads `plugins/keeper-vault/__init__.py` and
# reads `plugin.yaml` next to it, so there is nothing to import from the distribution
# and nothing to install with pip.
#
# The old configuration tried the opposite and broke in three ways at once:
#   * `[tool.setuptools.package-data] "" = ["plugin.yaml"]` is an invalid key -- the
#     key must be a module/package name or "*" -- so `python -m build` failed with
#     "configuration error: `tool.setuptools.package-data` keys must be named by ...";
#   * because a plugin that ships a pyproject.toml is a package-manager workspace
#     member, that build failure also blocked `hermes plugins install <url> --enable`
#     and `hermes plugins enable` (the install is published but stays disabled);
#   * `py-modules = ["__init__"]` would have installed a top-level `__init__.py` into
#     site-packages, where two such plugins silently overwrite each other.
#
# Metadata still lives here for tooling (name, version, licence, pytest config), and
# CI builds the distribution so this file can never break the install path again.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
